name: scrape-transactions

# Weekly, Thursday mornings (matches the local-paper "Thursday transactions" cadence).
# RETR reflects recorded transfers, so timing need not be precise.
on:
  schedule:
    - cron: "0 11 * * 4"   # 11:00 UTC Thursday (~6am CT)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # so we can dispatch the Pages deploy after a feed change

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 6 counties scrape sequentially (each a fresh <15-min TAP session).
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          RETR_TRACE_DIR: ${{ runner.temp }}/pw-trace   # capture trace + screenshot on failure
        run: python -m scraper.scrape

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: ${{ runner.temp }}/pw-trace
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit feed if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transactions.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh property transactions feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit made with GITHUB_TOKEN does NOT trigger other workflows (GitHub's
      # anti-recursion rule), so the feed push won't auto-deploy. Dispatch the
      # deploy explicitly when the feed actually changed.
      - name: Deploy the refreshed feed
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml
