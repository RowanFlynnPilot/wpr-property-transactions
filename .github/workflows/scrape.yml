name: scrape-transactions

# Weekly, Thursday mornings (matches the local-paper "Thursday transactions" cadence).
# RETR reflects recorded transfers, so timing need not be precise.
on:
  schedule:
    - cron: "0 11 * * 4"   # 11:00 UTC Thursday (~6am CT)
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # so we can dispatch the Pages deploy after a feed change

jobs:
  scrape:
    # Self-hosted runner on a residential IP: the WI DOR TAP firewall tarpits
    # GitHub's datacenter IP ranges (every navigation hangs the full timeout),
    # so the scrape must run from a non-blocked network. Only THIS job is
    # self-hosted — test.yml (which runs on pull requests) stays on GitHub-hosted
    # runners so untrusted PR code never touches the self-hosted machine.
    runs-on: [self-hosted, windows]
    timeout-minutes: 45   # 6 counties scrape sequentially; headroom for one whole-run retry.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: bash
        run: |
          pip install -r requirements.txt
          # No --with-deps on Windows (that flag installs Linux apt packages).
          python -m playwright install chromium

      - name: Scrape
        shell: bash
        env:
          RETR_TRACE_DIR: ${{ runner.temp }}/pw-trace   # capture trace + screenshot on failure
        run: |
          # Two layers of retry against the flaky DOR TAP endpoint:
          #   - tap.py retries each county's download 3x within a run (transient stalls);
          #   - this loop re-runs the whole scrape once after a pause, in case the
          #     endpoint is down for a stretch and a fresh run minutes later succeeds.
          # Fails loudly only if both whole-run attempts fail.
          for attempt in 1 2; do
            if python -m scraper.scrape; then exit 0; fi
            echo "scrape attempt $attempt failed"
            [ "$attempt" -lt 2 ] && { echo "waiting 90s for the endpoint to recover"; sleep 90; }
          done
          echo "::error::scrape failed after 2 whole-run attempts"; exit 1

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: ${{ runner.temp }}/pw-trace
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit feed if changed
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transactions.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: refresh property transactions feed"
            # The monthly history job or a manual push can advance main during this
            # run, so a plain push loses the race ("fetch first"). Rebase this
            # single-file commit onto the latest main and retry; the concurrent
            # pushes touch other files, so the rebase applies cleanly.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "push rejected (attempt $attempt) — rebasing onto origin/main"
              git pull --rebase origin main
              sleep 3
            done
            if [ "$pushed" != true ]; then
              echo "::error::could not push feed after 5 attempts"; exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A commit made with GITHUB_TOKEN does NOT trigger other workflows (GitHub's
      # anti-recursion rule), so the feed push won't auto-deploy. Dispatch the
      # deploy explicitly when the feed actually changed. Uses the REST API via
      # curl (Git Bash ships it) rather than `gh`, which isn't guaranteed on a
      # self-hosted machine.
      - name: Deploy the refreshed feed
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main"}'
